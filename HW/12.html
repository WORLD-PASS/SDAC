<!DOCTYPE html>
<html>
<head>
  <title>Font Styling Example</title>
  <style>
    h1 {
      font-family: 'Georgia', serif;
      font-size: 3rem;
      font-style: italic;
      font-weight: bold;
      text-decoration: underline wavy darkblue;
      text-transform: uppercase;
      color: darkslategray;
      margin-bottom: 20px;
    }

    p {
      font-family: 'Courier New', monospace;
      font-size: 1.1rem;
      font-style: normal;
      font-weight: 300;
      text-decoration: overline dotted crimson;
      text-transform: lowercase;
      color: dimgray;
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <h1>text and heading text decoratuion</h1>


  <p>
    Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla numquam quaerat quibusdam porro esse sint aliquid non, tenetur voluptas velit asperiores, maiores dolores sunt impedit!
  </p>
</body>
</html>
