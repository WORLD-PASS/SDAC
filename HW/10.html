<!DOCTYPE html>
<html>
<head>
  <title>Background Image </title>
  <style>
    section {
      width: 600px;
      height: 300px;
      margin: 30px auto;
      border: 2px solid darkslategray;
      border-radius: 8px;
      background-image: url('https://i.pinimg.com/736x/67/bb/ab/67bbab360ee872312a36425bf4594ca4.jpg');
      background-repeat: repeat;
      background-position: top left;
    }
     section {
      background-repeat: repeat-y;
      background-position: right top;
    } 
  </style>
</head>
<body>

  <section>
    <h2>Background Image</h2>
    <p>Use a background image in a <section> element and apply the properties backgroundrepeat and background-position to control how the image appears.</p>
  </section>

</body>
</html>
