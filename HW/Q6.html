<!DOCTYPE html>
<html>
<head>
  <title>ID Selector Example</title>
  <style>
    h1 {
      color: darkslategray;
      font-family: 'Georgia', serif;
      text-align: center;
    }

    p {
      color: dimgray;
      font-family: 'Arial', sans-serif;
      font-size: 1.1rem;
      text-align: center;
    }

    #my-button {
      background-color: darkorchid;
      padding: 14px 32px;
      font-style: italic;
      font-size: 1.1rem;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      margin: 20px auto;
    }

    #my-button:hover {
      background-color: darkmagenta;
    }
  </style>
</head>
<body>

  <h1>ID Selector Example</h1>

  <p>The button below is styled using a unique ID selector.</p>

  <button id="my-button">Click Me</button>

</body>
</html>
